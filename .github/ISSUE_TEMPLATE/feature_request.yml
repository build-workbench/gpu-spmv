name: Feature Request
description: Suggest a new feature or enhancement for GPU SpMV
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions?
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific use cases for this feature
      placeholder: |
        1. As a user doing X, I would...
        2. In my application Y, this would help...
    validations:
      required: true

  - type: textarea
    id: code-example
    attributes:
      label: Proposed API (if applicable)
      description: If this involves new API, show how it might look
      render: cpp
      placeholder: |
        // Example of how the new API might be used
        SpMVResult result = spmv_new_feature(...);

- type:checkboxes
            id:spec - driven
    attributes:
         label:Spec - Driven Development
       options:-
         label:I understand this feature would require a spec in `openspec /
               specs /` before implementation
      required:true

               -
          type:checkboxes id:checklist attributes:label:Checklist options:-
         label:I have checked that this feature has not been requested before
      required:true -
         label:I have read the existing specs in `openspec / specs /` required:false
