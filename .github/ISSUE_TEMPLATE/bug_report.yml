name: Bug 报告
description: 报告 Bug，帮助改善 GPU SpMV
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间报告这个 Bug！请填写以下内容。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清楚描述这个 Bug 是什么
      placeholder: "当我用 spmv_csr 运行..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 描述如何复现这个问题
      placeholder: |
        1. 用 `csr_create(...)` 创建矩阵
        2. 调用 `spmv_csr(...)`
        3. 观察到错误
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: 最小可复现示例
      description: 请提供能演示该问题的最小代码示例
      render: cpp
      placeholder: |
#include <spmv/spmv.h>
        int main() {
            // 你的代码
        }

  - type: markdown
    attributes:
      value: "## 环境信息"

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Ubuntu 22.04"
    validations:
      required: true

  - type: input
    id: cuda
    attributes:
      label: CUDA 版本
      placeholder: "12.0"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU 型号
      placeholder: "NVIDIA RTX 3090"
    validations:
      required: true

  - type: input
    id: cmake
    attributes:
      label: CMake 版本
      placeholder: "3.25"

  - type: textarea
    id: logs
    attributes:
      label: 错误信息 / 日志
      description: 请粘贴相关错误信息或日志
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已确认此 Bug 之前未被报告过
          required: true
        - label: 我已阅读 https://aicl-lab.github.io/gpu-spmv/ 上的文档
          required: false
