name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src include tests benchmarks -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.cu' \) | xargs clang-format-18 --dry-run --Werror

  configure-no-cuda:
    name: Configure Without CUDA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure fallback mode
        run: cmake -S . -B build-no-cuda -DSPMV_REQUIRE_CUDA=OFF

      - name: Ensure configure completed
        run: test -f build-no-cuda/CMakeCache.txt

      - name: Confirm no CUDA targets exist
        run: |
          python3 - <<'PY'
          import subprocess
          import sys

          output = subprocess.check_output(
              ["cmake", "--build", "build-no-cuda", "--target", "help"],
              text=True,
          )
          print(output)
          forbidden = ("spmv", "spmv_tests", "spmv_benchmark")
          if any(target in output for target in forbidden):
              sys.exit("Unexpected CUDA build target found in no-CUDA mode")
          PY

      - name: Confirm no build artifacts exist
        run: test ! -e build-no-cuda/spmv_benchmark && test ! -e build-no-cuda/spmv_tests && test ! -e build-no-cuda/libspmv.a

      - name: Show fallback cache setting
        run: cmake -LA -N build-no-cuda | grep SPMV_REQUIRE_CUDA

  build-cpu:
    name: Build CPU-only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: cmake -S . -B build -DSPMV_REQUIRE_CUDA=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: List build artifacts
        run: ls -la build/

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Run clang-tidy on source files
        run: |
          find src include -name '*.cpp' -o -name '*.h' -o -name '*.cu' | head -20 | xargs clang-tidy --warnings-as-errors='*' -- 2>/dev/null || true
          echo "Static analysis completed (warnings allowed for now)"
