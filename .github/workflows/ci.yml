name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src include tests examples tools -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.cu' \) \
            | xargs clang-format-18 --dry-run --Werror

  build-cpu:
    name: Build & Test (CPU-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpu-${{ runner.os }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DSPMV_REQUIRE_CUDA=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install package
        run: cmake --install build --prefix ${{ github.workspace }}/prefix

      # Regression: the exported target must carry its include directory,
      # otherwise find_package() consumers cannot compile.
      - name: Packaging smoke test (find_package consumer)
        run: |
          mkdir consumer && cd consumer
          cat > CMakeLists.txt <<'CMK'
          cmake_minimum_required(VERSION 3.18)
          project(consumer CXX)
          find_package(gpu_spmv REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE gpu_spmv::spmv)
          CMK
          cat > main.cpp <<'SRC'
          #include <spmv/spmv.h>
          int main() {
              spmv::SpMVConfig config;
              return config.block_size == spmv::DEFAULT_BLOCK_SIZE ? 0 : 1;
          }
          SRC
          cmake -S . -B build -G Ninja -Dgpu_spmv_DIR=${{ github.workspace }}/prefix/lib/cmake/gpu_spmv
          cmake --build build
          ./build/consumer

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DSPMV_REQUIRE_CUDA=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1

  cuda-compile:
    name: CUDA Compile Check
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: apt-get update && apt-get install -y cmake g++ ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSPMV_BUILD_TESTS=ON
          -DCMAKE_CUDA_ARCHITECTURES=80

      - name: Build
        run: cmake --build build --parallel

  # Runs the full GPU test suite on a self-hosted runner with an NVIDIA GPU.
  # Opt in by setting the repository variable CUDA_RUNNER_LABEL to the
  # runner label (e.g. "gpu"); without it this job is skipped and PRs are
  # still gated by the compile check above. See CONTRIBUTING.md.
  cuda-test:
    name: CUDA Build & Test (GPU)
    if: ${{ vars.CUDA_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.CUDA_RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSPMV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
