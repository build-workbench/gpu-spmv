name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-docs-node-modules-${{ hashFiles('docs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-docs-node-modules-

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Sync changelog
        working-directory: docs
        run: npm run sync

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set VitePress base
        run: echo "VITEPRESS_BASE=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"

      - name: Build VitePress
        working-directory: docs
        run: npm run build

      - name: Clean dist markdown leaks
        run: rm -f docs/.vitepress/dist/*.md

      - name: Add .nojekyll
        run: touch docs/.vitepress/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
