<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1120"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#76B900" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#76B900" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#76B900" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#76B900" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#76B900" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#76B900" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#76B900" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#76B900" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#76B900" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#76B900" stroke-width="1"/>
  </g>

  <!-- Sparse matrix visualization -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="60" height="60" fill="url(#greenGrad)" opacity="0.9" rx="4"/>
    <rect x="80" y="0" width="30" height="30" fill="url(#greenGrad)" opacity="0.6" rx="4"/>
    <rect x="0" y="80" width="30" height="30" fill="url(#greenGrad)" opacity="0.7" rx="4"/>
    <rect x="60" y="70" width="60" height="60" fill="url(#greenGrad)" opacity="0.9" rx="4"/>
    <rect x="140" y="100" width="30" height="60" fill="url(#greenGrad)" opacity="0.8" rx="4"/>
    <rect x="0" y="160" width="30" height="30" fill="url(#greenGrad)" opacity="0.5" rx="4"/>
    <rect x="80" y="150" width="60" height="60" fill="url(#greenGrad)" opacity="0.85" rx="4"/>
    <rect x="160" y="180" width="30" height="30" fill="url(#greenGrad)" opacity="0.6" rx="4"/>
  </g>

  <!-- Title -->
  <text x="350" y="180" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#F1F5F9">
    GPU SpMV
  </text>

  <!-- Subtitle -->
  <text x="350" y="250" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94A3B8">
    High-Performance CUDA Sparse Matrix-Vector Multiplication
  </text>

  <!-- Stats -->
  <g transform="translate(350, 320)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="90" y="35" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#76B900" text-anchor="middle">70%+</text>
    <text x="90" y="60" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Bandwidth Utilization</text>

    <!-- Stat 2 -->
    <rect x="200" y="0" width="180" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="290" y="35" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#00D4AA" text-anchor="middle">4</text>
    <text x="290" y="60" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Optimized Kernels</text>

    <!-- Stat 3 -->
    <rect x="400" y="0" width="180" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="490" y="35" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#8B5CF6" text-anchor="middle">100+</text>
    <text x="490" y="60" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Test Cases</text>
  </g>

  <!-- Features -->
  <g transform="translate(350, 450)">
    <circle cx="10" cy="10" r="6" fill="#76B900"/>
    <text x="25" y="15" font-family="Inter, sans-serif" font-size="18" fill="#F1F5F9">Merge Path for Perfect Load Balancing</text>

    <circle cx="10" cy="50" r="6" fill="#00D4AA"/>
    <text x="25" y="55" font-family="Inter, sans-serif" font-size="18" fill="#F1F5F9">Automatic Kernel Selection</text>

    <circle cx="10" cy="90" r="6" fill="#8B5CF6"/>
    <text x="25" y="95" font-family="Inter, sans-serif" font-size="18" fill="#F1F5F9">Spec-Driven Development</text>
  </g>

  <!-- Footer -->
  <text x="600" y="600" font-family="Inter, sans-serif" font-size="16" fill="#64748B" text-anchor="middle">
    github.com/LessUp/gpu-spmv
  </text>
</svg>