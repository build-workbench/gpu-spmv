# ═════════════════════════════════════════════════════════════════
# GPU SpMV Documentation Site Configuration
# Theme: just-the-docs (Optimized for product showcase)
# ═════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────
# Site Identity
# ─────────────────────────────────────────────────────────────────
title: GPU SpMV
description: >
  High-Performance CUDA Sparse Matrix-Vector Multiplication Library.
  70%+ memory bandwidth utilization with intelligent kernel selection.

# ─────────────────────────────────────────────────────────────────
# Theme Configuration
# ─────────────────────────────────────────────────────────────────
remote_theme: just-the-docs/just-the-docs@v0.8.1

# ─────────────────────────────────────────────────────────────────
# Plugins
# ─────────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-relative-links

# ─────────────────────────────────────────────────────────────────
# Repository & Build Settings
# ─────────────────────────────────────────────────────────────────
repository: LessUp/gpu-spmv
baseurl: /gpu-spmv
url: https://lessup.github.io

# ─────────────────────────────────────────────────────────────────
# SEO & Social
# ─────────────────────────────────────────────────────────────────
lang: zh
timezone: Asia/Shanghai

twitter:
  username: LessUp
  card: summary_large_image

social:
  name: LessUp
  links:
    - https://github.com/LessUp/gpu-spmv

# Open Graph defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      image: /assets/images/og-image.png
      author: LessUp

# ─────────────────────────────────────────────────────────────────
# Navigation
# ─────────────────────────────────────────────────────────────────
aux_links:
  "GitHub":
    - "https://github.com/LessUp/gpu-spmv"
  "Releases":
    - "https://github.com/LessUp/gpu-spmv/releases"

aux_links_new_tab: true

nav_external_links:
  - title: GPU SpMV on GitHub
    url: https://github.com/LessUp/gpu-spmv
    hide_icon: false

# ─────────────────────────────────────────────────────────────────
# UI Configuration
# ─────────────────────────────────────────────────────────────────
color_scheme: dark
color_scheme_toggle: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >
  <p>GPU SpMV &copy; 2024-2026 LessUp. MIT License.</p>

heading_anchors: true
enable_copy_code_button: true

# ─────────────────────────────────────────────────────────────────
# Search Configuration
# ─────────────────────────────────────────────────────────────────
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 10
  button: true

# ─────────────────────────────────────────────────────────────────
# Branding
# ─────────────────────────────────────────────────────────────────
logo: "/assets/images/logo.svg"
favicon_ico: "/assets/images/favicon.svg"

# ─────────────────────────────────────────────────────────────────
# Edit Link
# ─────────────────────────────────────────────────────────────────
gh_edit_link: true
gh_edit_link_text: "Edit this page"
gh_edit_repository: "https://github.com/LessUp/gpu-spmv"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# ─────────────────────────────────────────────────────────────────
# Markdown Processing
# ─────────────────────────────────────────────────────────────────
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

# ─────────────────────────────────────────────────────────────────
# Exclusions
# ─────────────────────────────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - _site
  - "*.tmp"
  - "*.swp"
  - README.md
  - changelog/20*.md
  - changelog/README.md
  - changelog/template.md

# ─────────────────────────────────────────────────────────────────
# i18n Data
# ─────────────────────────────────────────────────────────────────
data_dir: _data
