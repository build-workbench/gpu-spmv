# GPU SpMV Documentation Configuration
# Jekyll configuration for GitHub Pages

title: GPU SpMV
description: >-
  High-performance CUDA Sparse Matrix-Vector Multiplication Library
  高性能 CUDA 稀疏矩阵向量乘法库

remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

repository: LessUp/gpu-spmv
show_downloads: true

# Site Configuration
url: https://lessup.github.io
baseurl: /gpu-spmv
author: LessUp

# Multi-language Configuration
# Supported languages: en (English), zh (Chinese)
default_lang: en
languages:
  - code: en
    name: English
    flag: 🇺🇸
  - code: zh
    name: 简体中文
    flag: 🇨🇳

# Navigation - English
nav_en:
  - title: "Home"
    url: "/index.en"
  - title: "Installation"
    url: "/installation.en"
  - title: "API Reference"
    url: "/api.en"
  - title: "Examples"
    url: "/examples.en"
  - title: "Performance"
    url: "/performance.en"
  - title: "Architecture"
    url: "/architecture.en"
  - title: "Changelog"
    url: "/changelog.en"

# Navigation - Chinese
nav_zh:
  - title: "首页"
    url: "/"
  - title: "安装指南"
    url: "/installation"
  - title: "API 参考"
    url: "/api"
  - title: "示例代码"
    url: "/examples"
  - title: "性能优化"
    url: "/performance"
  - title: "架构设计"
    url: "/architecture"
  - title: "更新日志"
    url: "/changelog"

# Markdown Rendering
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Default Layout
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Exclude Files
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.cu"
  - "*.cuh"
  - "*.cpp"
  - "*.h"
  - README.md

# Collections for multi-language support
collections:
  docs_en:
    output: true
    permalink: /:name.en/
  docs_zh:
    output: true
    permalink: /:name/
